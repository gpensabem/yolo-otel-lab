name: yolo-otel-lab

services:
  # --------------------------------------------------------------- aplicação
  yolo-api:
    build: ./service
    image: yolo-otel-lab/api:latest
    ports:
      - "8000:8000"          # front-end + API
    environment:
      OTEL_SERVICE_NAME: yolo-api
      OTEL_RESOURCE_ATTRIBUTES: service.version=0.1.0,deployment.environment=lab
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      ORT_THREADS: "2"
      GRAFANA_PUBLIC_URL: http://localhost:3000
      PROMETHEUS_PUBLIC_URL: http://localhost:9090
    depends_on:
      - otel-collector

  # Gerador de carga opcional:  docker compose --profile load up -d
  loadgen:
    build: ./service                 # mesmo Dockerfile; o build reaproveita o cache
    image: yolo-otel-lab/api:latest
    profiles: ["load"]
    command: ["python", "scripts/loadgen.py"]
    environment:
      API_URL: http://yolo-api:8000
      WORKERS: "3"
    depends_on:
      - yolo-api

  # ------------------------------------------------------------ telemetria
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"          # OTLP gRPC (dá pra mandar telemetria do host também)
      - "4318:4318"          # OTLP HTTP
      - "8889:8889"          # métricas da app em formato Prometheus (veja no browser!)
      - "8888:8888"          # métricas internas do collector
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"          # API do Tempo (o Grafana consulta aqui)

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage   # guarda exemplares (trace_id nos histogramas)
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # lab local: sem login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/yolo.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
