global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Métricas da aplicação, convertidas pelo collector
  - job_name: yolo-app
    honor_labels: true   # mantém job/instance vindos do OTel (service.name) em vez de sobrescrever
    static_configs:
      - targets: ["otel-collector:8889"]

  # Saúde do próprio collector (spans/métricas recebidos, exportados, descartados...)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
